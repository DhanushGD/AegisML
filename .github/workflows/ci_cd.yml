# .github/workflows/ci_cd.yml
name: MLOps CI/CD Model Gatekeeper & Auto-Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # JOB 1: Test your API and Deploy to HuggingFace
  # ==========================================
  test_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx uvicorn great_expectations pandas evidently ollama

    # Note: Make sure src/validate.py doesn't crash if data/ processed isn't tracked in git
    - name: Run Data Schema Validation Check
      run: |
        python src/validate.py

    # Note: Your tests need to run without looking for local weights (mocked or registry pulled)
    - name: Execute Automated Unit Tests
      run: |
        pytest src/test_api.py

    - name: Deploy Microservice to Hugging Face Spaces
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        HF_SECRET: ${{ secrets.HF_TOKEN }}
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        
        # Check if remote 'hf' already exists to prevent errors on repeated runs
        git remote remove hf || true
        git remote add hf https://DhanushGD:$HF_SECRET@huggingface.co/spaces/DhanushGD/toxic-moderator-api
        
        git push --force hf main

  # ==========================================
  # JOB 2: Independent Automated Retraining Job
  # ==========================================
  retrain_model:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'trigger-retrain')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # (Note: Standard GitHub runners do not have free GPUs. In an interview context,
    # you explain that this job triggers a third-party server compute script like AWS or Modal)
    - name: Run Cloud Retraining Trigger
      run: |
        print("🏋️ Continuous Training Hook Active. Retraining model on Dataset v2...")
        # In a headless setup, you would execute your training scripts here:
        # python src/train.py