# .github/workflows/ci_cd.yml
name: MLOps CI/CD Model Gatekeeper & Auto-Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out code from GitHub repo
    - name: Checkout Code Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Crucial for stable git pushing to HF Spaces later

    # 2. Set up Python Environment
    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Install project dependencies
    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx uvicorn great_expectations pandas evidently ollama

    # 4. Run Great Expectations Data Quality Checklist
    - name: Run Data Schema Validation Check
      run: |
        python src/validate.py

    # 5. Run Pytest Suite to check FastAPI lifespan preloading and output formats
    - name: Execute Automated Unit Tests
      run: |
        pytest src/test_api.py

    # 6. AUTOMATED CD GATEWAY: Sync Code to Hugging Face Spaces (Only on merge to Main branch)
    - name: Deploy Microservice to Hugging Face Spaces
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        HF_SECRET: ${{ secrets.HF_TOKEN }}
      run: |
        # Configure git metadata inside the runner environment
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        
        # Add your specific Hugging Face Space repository as a remote endpoint
        # Replace 'DhanushGD/toxic-moderator-api' with your actual Space URL slug
        git remote add hf https://DhanushGD:$HF_SECRET@huggingface.co/spaces/DhanushGD/toxic-moderator-api
        
        # Force push the main codebase up to the space to trigger an instant cloud rebuild
        git push --force hf main