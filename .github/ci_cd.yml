# .github/workflows/ci_cd.yml
name: MLOps CI/CD Model Gatekeeper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out code from GitHub repo
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    # 2. Set up Python Environment on the runner machine
    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-python: '3.10'

    # 3. Install project dependencies
    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx uvicorn

    # 4. Pull validation tracking metrics baseline via DVC
    - name: Run Data Schema Validation Check
      run: |
        python src/validate.py

    # 5. Run Pytest Suite to check model inference shape and schemas
    - name: Execute Automated Unit Tests
      run: |
        pytest src/test_api.py